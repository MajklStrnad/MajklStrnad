<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbeaec"/>
      <stop offset="55%" stop-color="#eab8bd"/>
      <stop offset="100%" stop-color="#cf8c95"/>
    </radialGradient>

    <symbol id="petal" viewBox="0 0 32 32">
      <path d="M16 2 C 22 8, 26 14, 22 22 C 20 26, 18 28, 16 30 C 14 28, 12 26, 10 22 C 6 14, 10 8, 16 2 Z"
            fill="url(#petalGrad)" stroke="#b97a83" stroke-width="0.6"/>
      <path d="M16 6 Q 15 18, 16 28" stroke="#b97a83" stroke-width="0.5" fill="none"/>
    </symbol>

    <style><![CDATA[
      .bg   { fill: #0d0d0d; }
      .title{ fill: #D99AA0; font-family: 'Trebuchet MS', Helvetica, sans-serif;
              font-size: 46px; letter-spacing: 16px; }
      .sub  { fill: #8a6b70; font-family: 'Trebuchet MS', Helvetica, sans-serif;
              font-size: 12px; letter-spacing: 4px; }

      .petal {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation-name: fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes fall {
        0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
        8%   { opacity: 0.85; }
        78%  { opacity: 0.85; }
        95%  { opacity: 0; }
        100% { transform: translate(var(--dx, 40px), 300px) rotate(var(--rot, 360deg)); opacity: 0; }
      }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="260"/>

  <use href="#petal" class="petal" x="40"   y="-30" width="16" height="16" style="--dx:-40px;  --rot:-300deg; animation-duration:11s; animation-delay:-1s;"/>
  <use href="#petal" class="petal" x="150"  y="-30" width="22" height="22" style="--dx:60px;   --rot:340deg;  animation-duration:14s; animation-delay:-6s;"/>
  <use href="#petal" class="petal" x="260"  y="-30" width="14" height="14" style="--dx:-30px;  --rot:-420deg; animation-duration:9s;  animation-delay:-3s;"/>
  <use href="#petal" class="petal" x="380"  y="-30" width="20" height="20" style="--dx:50px;   --rot:380deg;  animation-duration:13s; animation-delay:-9s;"/>
  <use href="#petal" class="petal" x="480"  y="-30" width="16" height="16" style="--dx:-60px;  --rot:-360deg; animation-duration:10s; animation-delay:-4s;"/>
  <use href="#petal" class="petal" x="720"  y="-30" width="18" height="18" style="--dx:40px;   --rot:400deg;  animation-duration:12s; animation-delay:-7s;"/>
  <use href="#petal" class="petal" x="820"  y="-30" width="24" height="24" style="--dx:-50px;  --rot:-340deg; animation-duration:15s; animation-delay:-2s;"/>
  <use href="#petal" class="petal" x="930"  y="-30" width="14" height="14" style="--dx:30px;   --rot:320deg;  animation-duration:9s;  animation-delay:-5s;"/>
  <use href="#petal" class="petal" x="1030" y="-30" width="20" height="20" style="--dx:-45px;  --rot:-380deg; animation-duration:13s; animation-delay:-8s;"/>
  <use href="#petal" class="petal" x="1140" y="-30" width="16" height="16" style="--dx:55px;   --rot:360deg;  animation-duration:11s; animation-delay:-10s;"/>

  <text x="600" y="120" text-anchor="middle" class="title">MAIKL</text>
  <text x="600" y="155" text-anchor="middle" class="sub">WEB DEVELOPER &amp; CYBERSECURITY STUDENT</text>
</svg>
